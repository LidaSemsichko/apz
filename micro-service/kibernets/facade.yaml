apiVersion: apps/v1
kind: Deployment
metadata:
  name: facade-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facade-service
  template:
    metadata:
      labels:
        app: facade-service
    spec:
      containers:
        - name: facade-service
          image: facade-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: micro-config
          env:
            - name: SERVICE_NAME
              value: facade-service
---
apiVersion: v1
kind: Service
metadata:
  name: facade-service
spec:
  type: NodePort
  selector:
    app: facade-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080